server:
  port: 9090

spring:
  application:
    name: booklay-shop

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database: mysql

  kafka:
    consumer:
      group-id: shop-dev

  servlet:
    multipart:
      max-request-size: 200MB
      max-file-size: 200MB

cloud:
  auth-url: https://api-identity.infrastructure.cloud.toast.com/v2.0
  user-name: REDACTED
  password: REDACTED
  tenant-id: REDACTED
  storage-url: https://api-storage.cloud.toast.com/v1/AUTH_REDACTED
  container: /booklay_storage/

booklay:
  gateway-origin: http://localhost:8080
  gw-url: http://127.0.0.1
  secure:
    appkey: REDACTED
    db_username: REDACTED
    db_url: REDACTED
    db_password: REDACTED
    url: https://api-keymanager.nhncloudservice.com/keymanager/v1.0/appkey/REDACTED/secrets/
    p12_password: 1234
  pool_size: 2

  redis:
    port: 6379
    host: 127.0.0.1
    password:
    database: 0

  elasticsearch:
    uri: 133.186.210.108:9200

message:
  topic:
    coupon:
      request: coupon-zone-request-dev
      response: coupon-zone-response-dev

logging:
  level:
    root: info
    config: info
    repository: debug
    service: debug
    controller: debug
  config: classpath:logback/logback-spring.xml
